<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>마음 카드 만들기 · 카드제작기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe6; --card:#ffffff; --line:#e6dccd; --ink:#2f2a26;
    --muted:#8a7a6a; --accent:#d94f64; --accent-soft:#fdecef;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
    background:var(--paper); color:var(--ink); font-size:16px; line-height:1.45;
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .app{display:flex;flex-direction:column;height:100%;width:100%;max-width:520px;margin:0 auto;min-height:0}
  .head{padding:0 12px;flex:0 0 auto}
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 12px 108px;overscroll-behavior:contain}
  .top{padding:9px 0 2px;text-align:center}
  .top h1{margin:0;font-size:21px;letter-spacing:-.02em}
  .top p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}

  /* 카드 종류 */
  .types{display:flex;gap:8px;overflow-x:auto;padding:7px 2px 9px;scrollbar-width:none}
  .types::-webkit-scrollbar{display:none}
  .types{-webkit-mask-image:linear-gradient(to right,#000 91%,rgba(0,0,0,.25));mask-image:linear-gradient(to right,#000 91%,rgba(0,0,0,.25))}
  .type-btn{
    flex:0 0 auto;min-height:46px;padding:0 14px;border-radius:14px;
    border:1.5px solid var(--line);background:#fff;color:#4a3f36;
    font:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;
    box-shadow:0 1px 3px rgba(120,95,60,.06);cursor:pointer;
  }
  .type-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(217,79,100,.28)}

  /* 미리보기 */
  .preview-wrap{padding:6px 0 8px}
  .stage{position:relative;width:min(100%,308px);margin:0 auto;border-radius:20px;overflow:hidden;
    background:#fff;box-shadow:0 12px 30px rgba(90,65,35,.20)}
  #card{display:block;width:100%;height:auto;aspect-ratio:4/5;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .hint{position:absolute;left:8px;bottom:8px;background:rgba(47,42,38,.55);color:#fff;
    font-size:10.5px;padding:4px 8px;border-radius:20px;pointer-events:none;letter-spacing:-.01em}

  /* 패널 */
  .panel{background:var(--card);border-radius:18px;padding:14px 13px;margin:10px 0;
    box-shadow:0 2px 10px rgba(110,85,50,.07)}
  .panel-title{font-size:16px;font-weight:800;margin:0 0 10px;display:flex;align-items:baseline;gap:6px}
  .panel-title .sub{font-size:11.5px;font-weight:600;color:var(--muted)}
  .field{margin-bottom:10px}
  .field:last-of-type{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:5px;letter-spacing:-.01em}
  .field input,.field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;
    font:inherit;font-size:16px;background:#fffdf8;color:var(--ink);resize:vertical;
  }
  .field textarea{min-height:88px;line-height:1.5}
  .field input::placeholder,.field textarea::placeholder{color:#bdb2a4}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,79,100,.14);background:#fff}
  .field.on label{color:var(--accent)}
  .field.on input,.field.on textarea{border-color:var(--accent);background:#fffafb}

  .ghost{width:100%;min-height:46px;border-radius:13px;border:1.5px dashed #d8c9b4;background:#fffdf8;
    font:inherit;font-size:14.5px;font-weight:800;color:#a2683f;cursor:pointer}
  .ghost:active{background:#fff5e9}

  /* 구역 선택 */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .seg button{min-height:46px;border-radius:13px;border:1.5px solid var(--line);background:#fffdf8;
    font:inherit;font-size:13.5px;font-weight:800;color:#5b4d42;cursor:pointer}
  .seg button.on{background:#2f2a26;border-color:#2f2a26;color:#fff}

  .group-label{font-size:13px;font-weight:800;color:#6b5c4d;margin:12px 0 7px;display:flex;justify-content:space-between;align-items:baseline}
  .group-label .val{color:var(--accent);font-variant-numeric:tabular-nums}

  /* 글꼴 */
  .fonts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .font-chip{min-height:56px;border-radius:13px;border:1.5px solid var(--line);background:#fffdf8;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;padding:6px 4px;cursor:pointer}
  .font-chip .sample{font-size:18px;line-height:1.15;color:#2f2a26}
  .font-chip .fname{font-size:11px;color:var(--muted);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700}
  .font-chip.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px rgba(217,79,100,.14)}

  /* 크기 */
  .sizerow{display:flex;align-items:center;gap:8px}
  .sizerow button{width:50px;height:50px;flex:0 0 50px;border-radius:13px;border:1.5px solid var(--line);
    background:#fffdf8;font-size:24px;font-weight:800;color:#4a3f36;line-height:1;cursor:pointer}
  .sizerow button:active{background:#f4ece0}
  .sizerow input[type=range]{flex:1;min-width:0;height:34px;accent-color:var(--accent)}
  .badge{min-width:46px;text-align:center;font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}

  /* 색 */
  .colors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .sw{aspect-ratio:1;border-radius:50%;border:2px solid #e3d8c9;cursor:pointer;padding:0}
  .sw.on{border-color:#2f2a26;box-shadow:0 0 0 2px #fff inset,0 0 0 3px #2f2a26}
  .custom-color{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:10px;font-size:13px;font-weight:700;color:#6b5c4d;background:#fffdf8;
    border:1.5px solid var(--line);border-radius:13px;padding:6px 6px 6px 13px}
  .custom-color input{width:56px;height:38px;border:none;background:none;padding:0}

  /* 위치 패드 */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:232px;margin:0 auto}
  .pad button{height:50px;border-radius:13px;border:1.5px solid var(--line);background:#fffdf8;
    font-size:20px;color:#4a3f36;font-weight:800;cursor:pointer;line-height:1}
  .pad button:active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .pad .sp{height:50px}
  .pad-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:7px}

  /* 배경 */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 7px}
  .thumb{display:flex;flex-direction:column;gap:3px;background:none;border:none;padding:0;cursor:pointer;min-width:0}
  .thumb img,.thumb .blank{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;
    border:2px solid transparent;background:#fff;display:block}
  .thumb .blank{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#a89a89;
    background:#fffdf8;border:2px dashed #ded2c0;border-radius:10px}
  .thumb.on img,.thumb.on .blank{border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,79,100,.22)}
  .thumb .tname{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb.on .tname{color:var(--accent);font-weight:800}

  .bground{margin-top:11px;display:flex;gap:8px}
  .filebtn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:13px;flex:1 1 auto;
    border:1.5px solid #cfdcc6;background:#f5fbf2;color:#3f6b3a;font-weight:800;font-size:15px;cursor:pointer;text-align:center;padding:0 8px}
  .filebtn:active{background:#e9f5e3}
  .remove-photo{flex:0 0 auto;min-height:50px;padding:0 14px;border-radius:13px;border:1.5px solid #f0c3c9;
    background:#fff5f6;color:#c0394f;font:inherit;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
  .remove-photo:active{background:#ffe4e8}
  .remove-photo[hidden]{display:none}

  input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
  .baserow{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:13px;font-weight:700;color:#6b5c4d}
  .baserow input{width:52px;height:38px;border:none;background:none;padding:0}
  .baserow .muted{font-size:11px;color:var(--muted);font-weight:600;line-height:1.3}

  .tip{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 6px 8px;line-height:1.5}

  /* 휴대폰 키보드가 올라오면 미리보기를 잠시 접어 입력칸 자리를 넓혀요 */
  body:has(.field input:focus) .preview-wrap,
  body:has(.field textarea:focus) .preview-wrap{display:none}
  /* 화면이 낮은 기기에서는 미리보기를 조금 줄여요 */
  @media (max-height:760px){ .stage{width:min(100%,264px)} }
  @media (max-height:660px){ .stage{width:min(100%,220px)} .top p{display:none} }

  /* 하단 버튼 */
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
    border-top:1px solid #e8ddcd;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    display:flex;gap:9px;max-width:520px;margin:0 auto;backdrop-filter:blur(6px)}
  .actions button{flex:1;min-height:56px;border-radius:15px;border:none;font:inherit;font-size:16.5px;
    font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(60,40,20,.12)}
  .actions button:disabled{opacity:.6}
  #btnSave{background:#2f2a26;color:#fff}
  #btnShare{background:var(--accent);color:#fff}

  /* 토스트 */
  .toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:60;
    background:rgba(47,42,38,.94);color:#fff;font-size:13.5px;line-height:1.4;padding:11px 16px;
    border-radius:14px;max-width:min(88vw,420px);text-align:center;opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  /* 저장 이미지 확인 모달 (인앱 브라우저·모바일 꾹 눌러 저장 완벽 대응) */
  .save-modal[hidden]{display:none}
  .save-modal{position:fixed;inset:0;z-index:80;background:rgba(20,16,12,.72);
    display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}
  .save-box{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:18px 16px 16px;
    box-shadow:0 16px 40px rgba(0,0,0,.35);text-align:center}
  .save-box h2{margin:0 0 6px;font-size:18px;font-weight:800;color:#2f2a26}
  .save-box p{margin:0 0 12px;font-size:13.5px;line-height:1.45;color:#5f554c}
  .save-box img{display:block;width:min(100%,250px);aspect-ratio:4/5;object-fit:contain;
    margin:0 auto 12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.15);
    -webkit-touch-callout:default;user-select:auto}
  .save-btns{display:flex;gap:8px}
  .save-btns button{flex:1;min-height:46px;border-radius:12px;border:none;font:inherit;
    font-size:14.5px;font-weight:800;cursor:pointer}
  #btnModalDownload{background:#2f2a26;color:#fff}
  #btnModalClose{background:#efe7dc;color:#2f2a26}
  @media (max-width:360px){ .top h1{font-size:19px} .colors{grid-template-columns:repeat(6,1fr)} }
</style>
</head>
<body>
<div class="app">
<div class="head">
  <header class="top">
    <h1>💌 마음 카드 만들기</h1>
    <p>5가지 카드 · 글자 꾸미기 · 사진 배경 · 사진저장/카톡공유</p>
  </header>

  <div class="types" id="typeBar" role="tablist" aria-label="카드 종류"></div>

  <div class="preview-wrap">
    <div class="stage">
      <canvas id="card" width="720" height="900" aria-label="카드 미리보기"></canvas>
      <div class="hint">글자를 끌어서 옮겨 보세요</div>
    </div>
  </div>
</div>

<div class="scroll">
  <section class="panel">
    <div class="panel-title">1. 내용 쓰기</div>
    <div class="field" data-field="to">
      <label for="inTo">받는 사람 (To.)</label>
      <input id="inTo" type="text" placeholder="예) 사랑하는 엄마에게" autocomplete="off">
    </div>
    <div class="field" data-field="msg">
      <label for="inMsg">메시지</label>
      <textarea id="inMsg" rows="3" placeholder="전하고 싶은 마음을 적어 보세요. 줄을 바꿔도 그대로 나와요."></textarea>
    </div>
    <div class="field" data-field="from">
      <label for="inFrom">보내는 사람 (From.)</label>
      <input id="inFrom" type="text" placeholder="예) 딸 도연 드림" autocomplete="off">
    </div>
    <button class="ghost" id="btnSuggest">✨ 추천 문구 넣기</button>
  </section>

  <section class="panel">
    <div class="panel-title">2. 글자 꾸미기 <span class="sub">바꿀 부분을 고르세요</span></div>
    <div class="seg" id="secTabs">
      <button data-sec="to">받는 사람</button>
      <button data-sec="msg">메시지</button>
      <button data-sec="from">보내는 사람</button>
    </div>
    <div class="group-label">글꼴</div>
    <div class="fonts" id="fontList"></div>
    <div class="group-label">글씨 크기</div>
    <div class="sizerow">
      <button id="sizeMinus" aria-label="작게">−</button>
      <input type="range" id="sizeRange" min="16" max="90" step="1" value="52">
      <button id="sizePlus" aria-label="크게">+</button>
      <span class="badge" id="sizeVal">52</span>
    </div>
    <div class="group-label">글씨 색</div>
    <div class="colors" id="colorList"></div>
    <label class="custom-color">직접 고르기 <input type="color" id="colorPick" value="#3a2a24"></label>
    <div class="group-label">글씨 위치 <span class="val" id="posVal"></span></div>
    <div class="pad" id="pad">
      <span class="sp"></span><button data-move="up" aria-label="위로">▲</button><span class="sp"></span>
      <button data-move="left" aria-label="왼쪽">◀</button><button data-move="center" aria-label="원위치">⌖</button><button data-move="right" aria-label="오른쪽">▶</button>
      <span class="sp"></span><button data-move="down" aria-label="아래로">▼</button><span class="sp"></span>
    </div>
    <div class="pad-hint">⌖ 는 처음 위치로 돌아가요 · 미리보기에서 끌어도 돼요</div>
  </section>

  <section class="panel">
    <div class="panel-title">3. 배경 고르기</div>
    <div class="gallery" id="gallery"></div>
    <div class="bground">
      <label class="filebtn" for="photoInput">📷 내 사진으로 배경 넣기</label>
      <button class="remove-photo" id="btnRemovePhoto" hidden>🗑 사진 삭제</button>
      <input type="file" id="photoInput" accept="image/*" hidden>
    </div>
    <div class="group-label">배경 진하기 <span class="val" id="opacityVal">100%</span></div>
    <input type="range" id="opacityRange" min="0" max="100" step="1" value="100">
    <div class="baserow">
      <span>바탕색</span>
      <input type="color" id="baseColor" value="#ffffff">
      <span class="muted">진하기를 낮추면 이 색이 비쳐요</span>
    </div>
  </section>

  <div class="tip">💡 저장한 사진은 휴대폰의 ‘다운로드’ 폴더나 갤러리에서 확인하세요.</div>
</div>
</div>

<div class="actions">
  <button id="btnSave">🖼 사진으로 저장</button>
  <button id="btnShare">📤 카톡으로 공유</button>
</div>
<div id="saveModal" class="save-modal" hidden role="dialog" aria-modal="true" aria-label="완성된 카드 저장">
  <div class="save-box">
    <h2>✨ 카드가 완성됐어요!</h2>
    <p>자동 저장이 안 될 땐 아래 이미지를<br><strong>손가락으로 꾹 눌러 ‘이미지 저장’</strong> 해주세요.</p>
    <img id="savePreviewImg" alt="완성된 마음 카드">
    <div class="save-btns">
      <button id="btnModalDownload" type="button">⬇️ 파일로 저장</button>
      <button id="btnModalClose" type="button">닫기</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ============ 작은 도우미 ============ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function rng(seed){ let s = seed || 1; return function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
const svgURL = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const wrapSVG = body => '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">' + body + '</svg>';

/* ============ 글꼴 ============ */
const FONTS = {
  gothic:   { name:'기본 고딕', css:"'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Nanum Gothic',system-ui,sans-serif", weight:700 },
  myeongjo: { name:'감성 명조', css:"'Nanum Myeongjo','Batang','Apple SD Gothic Neo',serif", weight:700 },
  round:    { name:'둥근 고딕', css:"'Jua','Arial Rounded MT Bold','Apple SD Gothic Neo','Malgun Gothic',sans-serif", weight:400 },
  pen:      { name:'손글씨체', css:"'Nanum Pen Script','Gaegu','Apple SD Gothic Neo',cursive", weight:400 },
  black:    { name:'굵은 제목', css:"'Black Han Sans','Gmarket Sans','Malgun Gothic',sans-serif", weight:400 }
};
const FONT_ORDER = ['gothic','myeongjo','round','pen','black'];

/* ============ 카드 종류 / 추천 문구 ============ */
const TYPES = {
  birthday:{ label:'생일축하', icon:'🎂', bgs:['b1','b2','b3','none'] },
  thanks:  { label:'감사',     icon:'💌', bgs:['t1','t2','t3','none'] },
  cheer:   { label:'응원',     icon:'💪', bgs:['c1','c2','c3','none'] },
  xmas:    { label:'크리스마스', icon:'🎄', bgs:['x1','x2','x3','none'] },
  custom:  { label:'직접만들기', icon:'✏️', bgs:['f1','f2','f3','f4','none'] }
};
const SUGGEST = {
  birthday:{ to:'사랑하는 ○○에게', msg:'생일을 진심으로 축하해요!\n오늘 하루가 웃음으로\n가득하길 바라요.', from:'○○ 드림' },
  thanks:  { to:'고마운 ○○님께', msg:'덕분에 큰 힘을 냈어요.\n늘 감사한 마음을\n갖고 있습니다.', from:'○○ 올림' },
  cheer:   { to:'힘내는 ○○에게', msg:'잘하고 있어요!\n우리는 당신을 응원합니다.\n힘차게 화이팅!', from:'○○ 드림' },
  xmas:    { to:'메리 크리스마스, ○○님', msg:'따뜻한 마음을 담아\n크리스마스 인사를 전해요.\n행복한 연말 보내세요.', from:'산타 ○○○ 올림' },
  custom:  { to:'', msg:'', from:'' }
};

/* ============ 배경 SVG (100% 인라인, 외부 이미지 없음) ============ */
function confetti(n, colors, seed, area){
  area = area || { x:0, y:0, w:1080, h:1350 };
  let s = '', r = rng(seed || 11);
  for (let i = 0; i < n; i++){
    const x = area.x + r() * area.w, y = area.y + r() * area.h;
    const w = 8 + r() * 16, h = w * (0.4 + r() * 0.25), rot = r() * 180;
    const c = colors[i % colors.length];
    s += '<rect x="' + x.toFixed(0) + '" y="' + y.toFixed(0) + '" width="' + w.toFixed(0) + '" height="' + h.toFixed(0) +
         '" rx="' + (h * 0.3).toFixed(1) + '" fill="' + c + '" opacity="' + (0.3 + r() * 0.4).toFixed(2) +
         '" transform="rotate(' + rot.toFixed(0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + ')"/>';
  }
  return s;
}
function starField(n, color, seed, opMax){
  color = color || '#ffffff'; opMax = opMax || 0.9;
  let s = '', r = rng(seed || 5);
  for (let i = 0; i < n; i++){
    const x = r() * 1080, y = r() * 1350, rad = 0.8 + r() * 2.2;
    s += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + rad.toFixed(1) +
         '" fill="' + color + '" opacity="' + (0.2 + r() * opMax * 0.8).toFixed(2) + '"/>';
  }
  return s;
}
function snowField(n, seed){
  let s = '', r = rng(seed || 9);
  for (let i = 0; i < n; i++){
    const x = r() * 1080, y = r() * 1350, rad = 2 + r() * 4;
    s += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + rad.toFixed(1) +
         '" fill="#ffffff" opacity="' + (0.3 + r() * 0.6).toFixed(2) + '"/>';
  }
  return s;
}
function snowflake(cx, cy, rad, op, color){
  op = op == null ? 0.85 : op; color = color || '#ffffff';
  let s = '<g stroke="' + color + '" stroke-width="' + Math.max(1.5, rad * 0.09).toFixed(1) +
          '" opacity="' + op + '" stroke-linecap="round">';
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 3 * i;
    const x2 = cx + Math.cos(a) * rad, y2 = cy + Math.sin(a) * rad;
    s += '<line x1="' + cx.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>';
    const bx = cx + Math.cos(a) * rad * 0.6, by = cy + Math.sin(a) * rad * 0.6;
    [-0.75, 0.75].forEach(function(off){
      const a2 = a + off;
      s += '<line x1="' + bx.toFixed(1) + '" y1="' + by.toFixed(1) + '" x2="' +
           (bx + Math.cos(a2) * rad * 0.3).toFixed(1) + '" y2="' + (by + Math.sin(a2) * rad * 0.3).toFixed(1) + '"/>';
    });
  }
  return s + '</g>';
}
function balloon(cx, cy, rx, ry, color){
  const by = cy + ry * 1.18;
  return '<g><ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + color + '"/>' +
    '<ellipse cx="' + (cx - rx * 0.32) + '" cy="' + (cy - ry * 0.36) + '" rx="' + (rx * 0.2) + '" ry="' + (ry * 0.28) + '" fill="#ffffff" opacity=".45"/>' +
    '<path d="M' + cx + ' ' + by + ' l-10 19 h20 z" fill="' + color + '"/>' +
    '<path d="M' + cx + ' ' + (by + 19) + ' q' + (rx * 0.45) + ' ' + (ry * 0.85) + ' -' + (rx * 0.22) + ' ' + (ry * 1.55) +
    '" stroke="' + color + '" stroke-width="2.5" fill="none" opacity=".55"/></g>';
}
function heart(cx, cy, s, color, op){
  return '<path d="M' + cx + ' ' + (cy + s * 0.85) +
    ' C ' + (cx - s * 1.4) + ' ' + (cy - s * 0.2) + ' ' + (cx - s * 0.7) + ' ' + (cy - s * 1.15) + ' ' + cx + ' ' + (cy - s * 0.42) +
    ' C ' + (cx + s * 0.7) + ' ' + (cy - s * 1.15) + ' ' + (cx + s * 1.4) + ' ' + (cy - s * 0.2) + ' ' + cx + ' ' + (cy + s * 0.85) +
    ' Z" fill="' + color + '" opacity="' + op + '"/>';
}
function leafBranch(x, y, rot, color){
  let s = '<g transform="translate(' + x + ',' + y + ') rotate(' + rot + ')" opacity=".8">';
  s += '<path d="M0 0 C 40 -70 130 -110 230 -100" stroke="' + color + '" stroke-width="4" fill="none" opacity=".85"/>';
  for (let i = 0; i < 7; i++){
    const px = 18 + i * 30, py = -8 - i * 14;
    s += '<ellipse cx="' + px + '" cy="' + py + '" rx="27" ry="11" fill="' + color + '" opacity="' + (0.55 + (i % 3) * 0.12).toFixed(2) +
         '" transform="rotate(' + (-32 - i * 3) + ' ' + px + ' ' + py + ')"/>';
    s += '<ellipse cx="' + (px + 10) + '" cy="' + (py + 28) + '" rx="24" ry="10" fill="' + color + '" opacity="' + (0.45 + (i % 3) * 0.1).toFixed(2) +
         '" transform="rotate(' + (26 - i * 3) + ' ' + (px + 10) + ' ' + (py + 28) + ')"/>';
  }
  return s + '</g>';
}
function pine(x, y, sc, color, op){
  let s = '<g transform="translate(' + x + ',' + y + ') scale(' + sc + ')" fill="' + color + '" opacity="' + op + '">';
  for (let i = 0; i < 4; i++){
    const yy = -i * 68, w = 118 - i * 22;
    s += '<path d="M0 ' + (yy - 128) + ' L' + (-w) + ' ' + yy + ' L' + w + ' ' + yy + ' Z"/>';
  }
  s += '<rect x="-9" y="-8" width="18" height="34"/></g>';
  return s;
}

/* ============ 상태 ============ */
const HOME = { to:{x:.5,y:.14}, msg:{x:.5,y:.52}, from:{x:.5,y:.86} };
const state = {
  type:'birthday',
  active:'to',
  sections:{
    to:  { text:'', x:.5, y:.14, size:52, color:'#3a2a24', font:'round' },
    msg: { text:'', x:.5, y:.52, size:33, color:'#4a3f36', font:'gothic' },
    from:{ text:'', x:.5, y:.86, size:32, color:'#3a2a24', font:'round' }
  },
  bgId:'b1',
  bgOpacity:100,
  baseColor:'#ffffff',
  photo:null,
  bgBeforePhoto:null,
  autoColor:true
};
const KEYS = ['to','msg','from'];
const SEC_NAME = { to:'받는 사람', msg:'메시지', from:'보내는 사람' };
const imgCache = {};
let lastSuggest = null;

/* 어두운 배경에서는 밝은 글씨가 잘 보여요 */
const DARK_BGS = { x1:1, x3:1, c3:1, f3:1 };
function preferredInk(){
  if (state.bgId === 'photo') return '#ffffff';
  if (state.bgId === 'none') return '#3a2a24';
  return DARK_BGS[state.bgId] ? '#fffdf5' : '#3a2a24';
}
function applyAutoInk(){
  if (!state.autoColor) return;
  const ink = preferredInk();
  KEYS.forEach(function(k){ state.sections[k].color = ink; });
  if (typeof syncPanel === 'function') syncPanel();
}
function luminance(hex){
  let h = String(hex || '#000000').replace('#', '');
  if (h.length === 3) h = h.split('').map(function(c){ return c + c; }).join('');
  if (h.length !== 6) return 0;
  const r = parseInt(h.slice(0, 2), 16) / 255,
        g = parseInt(h.slice(2, 4), 16) / 255,
        b = parseInt(h.slice(4, 6), 16) / 255;
  const f = function(c){ return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}

/* ============ 배경 이미지 ============ */
function bgImage(id){
  if (!id || id === 'none') return null;
  const img = imgCache[id];
  return (img && img.complete && img.naturalWidth) ? img : null;
}
function preloadBackgrounds(){
  Object.keys(BG).forEach(function(id){
    if (!BG[id].url) BG[id].url = svgURL(BG[id].svg());
    const img = new Image();
    img.onload = function(){ imgCache[id] = img; drawPreview(); };
    img.onerror = function(){ console.warn('배경을 그리지 못했어요: ' + id); };
    img.src = BG[id].url;
  });
}

/* ============ 그리기 ============ */
const pc = $('#card');
const pctx = pc.getContext('2d');

function fontCss(fontId){ return FONTS[fontId] ? FONTS[fontId].css : FONTS.gothic.css; }
function fontWeight(fontId){ return FONTS[fontId] ? FONTS[fontId].weight : 700; }

function measure(ctx, sec, W){
  const scale = W / 1080;
  const size = sec.size * scale;
  const lineH = size * 1.36;
  const maxW = W * 0.86;
  const css = fontWeight(sec.font) + ' ' + size + 'px ' + fontCss(sec.font);
  ctx.font = css;
  const paras = String(sec.text == null ? '' : sec.text).split('\n');
  const lines = [];
  let maxLineW = 0;
  paras.forEach(function(para){
    if (!para.length){ lines.push(''); return; }
    let line = '';
    const chars = Array.from(para);
    for (let i = 0; i < chars.length; i++){
      const test = line + chars[i];
      if (line && ctx.measureText(test).width > maxW){ lines.push(line); line = chars[i]; }
      else line = test;
    }
    lines.push(line);
  });
  lines.forEach(function(ln){ const w = ctx.measureText(ln).width; if (w > maxLineW) maxLineW = w; });
  if (!maxLineW) maxLineW = size * 0.6;
  return { lines: lines, size: size, lineH: lineH, width: maxLineW, blockH: Math.max(lines.length, 1) * lineH, css: css };
}

function drawSections(ctx, W, H){
  KEYS.forEach(function(key){
    const sec = state.sections[key];
    if (!String(sec.text).trim()) return;
    const L = measure(ctx, sec, W);
    const cx = sec.x * W, cy = sec.y * H;
    const top = cy - L.blockH / 2;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = L.css;
    ctx.fillStyle = sec.color;
    const light = luminance(sec.color) > 0.5;
    ctx.shadowColor = light ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.85)';
    ctx.shadowBlur = Math.max(2, L.size * (light ? 0.24 : 0.32));
    for (let i = 0; i < L.lines.length; i++){
      if (!L.lines[i]) continue;
      ctx.fillText(L.lines[i], cx, top + L.lineH * (i + 0.5));
    }
    ctx.restore();
  });
}

function drawCover(ctx, img, W, H){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  const s = Math.max(W / iw, H / ih);
  const w = iw * s, h = ih * s;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
}

function drawCard(ctx, W, H){
  ctx.save();
  ctx.fillStyle = state.baseColor || '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const img = state.photo || bgImage(state.bgId);
  if (img){
    const a = clamp(state.bgOpacity, 0, 100) / 100;
    if (a > 0){
      ctx.save();
      ctx.globalAlpha = a;
      drawCover(ctx, img, W, H);
      ctx.restore();
    }
  }
  drawSections(ctx, W, H);
}

function bounds(key, W, H){
  const sec = state.sections[key];
  if (!String(sec.text).trim()) return null;
  W = W || pc.width; H = H || pc.height;
  const L = measure(pctx, sec, W);
  return {
    x0: sec.x * W - L.width / 2, y0: sec.y * H - L.blockH / 2,
    w: L.width, h: L.blockH, cx: sec.x * W, cy: sec.y * H, size: L.size
  };
}

let rafId = 0;
function requestDraw(){
  if (rafId) return;
  rafId = requestAnimationFrame(function(){ rafId = 0; drawPreview(); });
}

function drawPreview(){
  const W = pc.width, H = pc.height;
  pctx.clearRect(0, 0, W, H);
  drawCard(pctx, W, H);
  // 선택한 글자 테두리(미리보기 전용, 저장 이미지에는 없음)
  const b = bounds(state.active, W, H);
  if (b){
    pctx.save();
    pctx.setLineDash([9, 6]);
    pctx.lineWidth = 2;
    pctx.strokeStyle = 'rgba(217,79,100,.7)';
    pctx.strokeRect(b.x0 - 7, b.y0 - 6, b.w + 14, b.h + 12);
    pctx.restore();
  }
}

/* ============ 패널 동기화 ============ */
function syncPanel(){

  $$('#secTabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.sec === state.active); });
  $$('.field').forEach(function(f){ f.classList.toggle('on', f.dataset.field === state.active); });

function syncInputs(){

}

function setActive(key){

}

/* ============ 카드 종류 ============ */
function setType(t){
  if (!TYPES[t]) return;
  state.type = t;
  if (!state.photo) state.bgId = TYPES[t].bgs[0];
  else state.bgId = 'photo';
  applyAutoInk();
  applySuggestion(t, false);
  $$('#typeBar .type-btn').forEach(function(b){ b.classList.toggle('on', b.dataset.type === t); });
  buildGallery(); syncPanel(); drawPreview();
}

function allEmpty(){
  return KEYS.every(function(k){ return !String(state.sections[k].text).trim(); });
}
function isPureSuggestion(){
  if (!lastSuggest) return false;
  return KEYS.every(function(k){ return state.sections[k].text === lastSuggest[k]; });
}
function applySuggestion(t, force){
  const s = SUGGEST[t];
  if (!s) return false;
  const canFill = force || allEmpty() || isPureSuggestion();
  if (!canFill) return false;
  const any = KEYS.some(function(k){ return s[k]; });
  if (!any) return false;
  KEYS.forEach(function(k){ state.sections[k].text = s[k] || ''; });
  lastSuggest = { to: s.to, msg: s.msg, from: s.from };
  syncInputs();
  return true;
}

/* ============ 이벤트 ============ */
function bind(){
  // 내용 입력
  $('#inTo').addEventListener('input', function(){ state.sections.to.text = this.value; setActive('to'); requestDraw(); });
  $('#inMsg').addEventListener('input', function(){ state.sections.msg.text = this.value; setActive('msg'); requestDraw(); });
  $('#inFrom').addEventListener('input', function(){ state.sections.from.text = this.value; setActive('from'); requestDraw(); });
  ['to','msg','from'].forEach(function(k){
    const el = $('#in' + (k === 'to' ? 'To' : k === 'msg' ? 'Msg' : 'From'));
    el.addEventListener('focus', function(){ setActive(k); });
  });

  $('#btnSuggest').addEventListener('click', function(){
    const ok = applySuggestion(state.type, true);
    if (ok) { syncPanel(); drawPreview(); toast('추천 문구를 넣었어요. 마음껏 고쳐서 쓰세요.'); }
    else toast('직접만들기 카드예요. 전하고 싶은 마음을 적어 보세요.');
  });

  // 구역 선택
  $$('#secTabs button').forEach(function(b){
    b.addEventListener('click', function(){ setActive(b.dataset.sec); });
  });

  // 크기
  $('#sizeRange').addEventListener('input', function(){
    state.sections[state.active].size = +this.value;
    $('#sizeVal').textContent = this.value;
    requestDraw();
  });
  function nudgeSize(d){
    const sec = state.sections[state.active];
    sec.size = clamp(sec.size + d, 16, 90);
    $('#sizeRange').value = sec.size; $('#sizeVal').textContent = sec.size;
    requestDraw();
  }
  $('#sizeMinus').addEventListener('click', function(){ nudgeSize(-2); });
  $('#sizePlus').addEventListener('click', function(){ nudgeSize(2); });

  // 색
  $('#colorPick').addEventListener('input', function(){
    state.autoColor = false;
    state.sections[state.active].color = this.value;
    $$('#colorList .sw').forEach(function(b){ b.classList.toggle('on', b.dataset.color.toLowerCase() === this.value.toLowerCase()); }, this);
    requestDraw();
  });

  // 위치 이동
  $$('#pad [data-move]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const sec = state.sections[state.active];
      const dx = 0.022, dy = 0.022;
      switch (btn.dataset.move){
        case 'up': sec.y = clamp(sec.y - dy, 0.05, 0.95); break;
        case 'down': sec.y = clamp(sec.y + dy, 0.05, 0.95); break;
        case 'left': sec.x = clamp(sec.x - dx, 0.05, 0.95); break;
        case 'right': sec.x = clamp(sec.x + dx, 0.05, 0.95); break;
        case 'center': sec.x = 0.5; sec.y = HOME[state.active].y; break;
      }
      requestDraw();
    });
  });

  // 배경 진하기 / 바탕색
  $('#opacityRange').addEventListener('input', function(){
    state.bgOpacity = +this.value;
    $('#opacityVal').textContent = this.value + '%';
    requestDraw();
  });
  $('#baseColor').addEventListener('input', function(){
    state.baseColor = this.value;
    requestDraw();
  });

  // 사진
  $('#photoInput').addEventListener('change', function(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)){ toast('사진 파일을 골라 주세요.'); e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        if (!state.photo) state.bgBeforePhoto = state.bgId;
        state.photo = img;
        state.bgId = 'photo';
        applyAutoInk();
        state.bgOpacity = 100;
        $('#opacityRange').value = 100;
        $('#opacityVal').textContent = '100%';
        syncPhotoButton();
        buildGallery(); drawPreview();
        toast('사진을 배경으로 넣었어요. 진하기로 밝기를 맞춰 보세요.');
      };
      img.onerror = function(){ toast('사진을 불러오지 못했어요. 다른 사진으로 해보세요.'); };
      img.src = reader.result;
    };
    reader.onerror = function(){ toast('사진을 읽지 못했어요.'); };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  $('#btnRemovePhoto').addEventListener('click', removePhoto);

  // 미리보기 끌어서 이동
  let drag = null;
  function pt(e){
    const r = pc.getBoundingClientRect();
    return { x: (e.clientX - r.left) * pc.width / r.width, y: (e.clientY - r.top) * pc.height / r.height };
  }
  function hit(p){
    const found = [];
    KEYS.forEach(function(k){
      const b = bounds(k);
      if (!b) return;
      const pad = Math.max(14, b.size * 0.45);
      if (p.x > b.x0 - pad && p.x < b.x0 + b.w + pad && p.y > b.y0 - pad && p.y < b.y0 + b.h + pad){
        found.push({ k: k, area: b.w * b.h });
      }
    });
    if (!found.length) return null;
    found.sort(function(a, b){ return a.area - b.area; });
    return found[0].k;
  }
  pc.addEventListener('pointerdown', function(e){
    const p = pt(e);
    const k = hit(p);
    if (!k) return;
    setActive(k);
    const sec = state.sections[k];
    drag = { k: k, dx: p.x - sec.x * pc.width, dy: p.y - sec.y * pc.height };
    try { pc.setPointerCapture(e.pointerId); } catch (err) {}
    pc.style.cursor = 'grabbing';
    e.preventDefault();
  });
  pc.addEventListener('pointermove', function(e){
    if (!drag) return;
    const p = pt(e), sec = state.sections[drag.k];
    sec.x = clamp((p.x - drag.dx) / pc.width, 0.05, 0.95);
    sec.y = clamp((p.y - drag.dy) / pc.height, 0.05, 0.95);
    requestDraw();
    e.preventDefault();
  });
  function endDrag(){ if (!drag) return; drag = null; pc.style.cursor = 'grab'; }
  pc.addEventListener('pointerup', endDrag);
  pc.addEventListener('pointercancel', endDrag);
  pc.addEventListener('pointerleave', function(){ if (drag) endDrag(); });

  $('#btnSave').addEventListener('click', onSave);
  $('#btnShare').addEventListener('click', onShare);
}

/* ============ 저장 / 공유 ============ */
function stamp(){
  const d = new Date(), p = function(n){ return String(n).padStart(2, '0'); };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

const EXPORT_W = 1080, EXPORT_H = 1350;
const WEBFONTS = ['Jua', 'Nanum Myeongjo', 'Nanum Pen Script', 'Black Han Sans'];
async function ensureFonts(){
  if (!document.fonts) return;
  try {
    await Promise.all(WEBFONTS.map(function(f){
      return document.fonts.load('40px "' + f + '"').catch(function(){});
    }));
  } catch (err) {}
  try { await document.fonts.ready; } catch (err) {}
}
async function makeBlob(){
  await ensureFonts();
  const c = document.createElement('canvas');
  c.width = EXPORT_W; c.height = EXPORT_H;
  const ctx = c.getContext('2d');
  drawCard(ctx, EXPORT_W, EXPORT_H);
  return await new Promise(function(res, rej){
    try {
      c.toBlob(function(b){ b ? res(b) : rej(new Error('PNG를 만들지 못했어요')); }, 'image/png');
    } catch (err){ rej(err); }
  });
}

function dataURLtoBlob(dataUrl){
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/png';
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function makeExportSync(){
  const c = document.createElement('canvas');
  c.width = EXPORT_W; c.height = EXPORT_H;
  drawCard(c.getContext('2d'), EXPORT_W, EXPORT_H);
  const dataUrl = c.toDataURL('image/png');
  return { dataUrl: dataUrl, blob: dataURLtoBlob(dataUrl) };
}

function download(blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '카드_' + stamp() + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}

let lastExport = null;
function openSaveModal(dataUrl, blob){
  lastExport = { dataUrl: dataUrl, blob: blob };
  $('#savePreviewImg').src = dataUrl;
  $('#saveModal').hidden = false;
}
function closeSaveModal(){
  $('#saveModal').hidden = true;
}
$('#btnModalClose').addEventListener('click', closeSaveModal);
$('#saveModal').addEventListener('click', function(e){
  if (e.target === $('#saveModal')) closeSaveModal();
});
$('#btnModalDownload').addEventListener('click', function(){

  download(lastExport.blob);

});

function onSave(){
  const btn = $('#btnSave'), old = btn.textContent;
  btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const exp = makeExportSync();
    download(exp.blob);
    openSaveModal(exp.dataUrl, exp.blob);
    toast('파일 저장을 실행했어요. 안 보이면 뜬 이미지를 꾹 눌러 저장하세요!');
  } catch (err){
    console.warn(err);
    toast('저장하지 못했어요. 다시 한 번 눌러 주세요.');
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

function shareFallbackMsg(){
  if (location.protocol === 'file:'){
    return '파일로 열면 공유 기능이 막혀 사진 저장 창을 열었어요. 이미지를 꾹 눌러 저장해 주세요.';
  }
  return '이 브라우저는 바로 공유를 지원하지 않아 저장 창을 열었어요. 저장 후 카톡으로 보내 주세요.';
}
async function onShare(){
  const btn = $('#btnShare'), old = btn.textContent;
  btn.disabled = true; btn.textContent = '준비 중…';
  try {
    const exp = makeExportSync();
    const file = new File([exp.blob], '카드_' + stamp() + '.png', { type:'image/png' });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file], title: '마음 카드', text: '마음을 담은 카드를 보냅니다 💌' });
        toast('공유 창에서 카카오톡을 골라 보내세요.');
      } catch (err){
        if (err && err.name === 'AbortError') return;
        download(exp.blob);
        openSaveModal(exp.dataUrl, exp.blob);
        toast(shareFallbackMsg());
      }
    } else {
      download(exp.blob);
      openSaveModal(exp.dataUrl, exp.blob);
      toast(shareFallbackMsg());
    }
  } catch (err){
    console.warn(err);
    toast('공유하지 못했어요. 다시 한 번 눌러 주세요.');
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

/* ============ 토스트 ============ */
let toastTimer = 0;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

/* ============ 시작 ============ */
buildTypes();
buildFonts();
buildColors();
preloadBackgrounds();
buildGallery();
syncPhotoButton();
bind();
state.type = 'birthday';
applySuggestion('birthday', true);
applyAutoInk();
$$('#typeBar .type-btn').forEach(function(b){ b.classList.toggle('on', b.dataset.type === 'birthday'); });
syncPanel();
syncInputs();
drawPreview();
ensureFonts().then(function(){ drawPreview(); });

/* 테스트용 (앱 동작에는 영향 없음) */
window.__cardApp = {
  state: state,
  setType: setType,
  setActive: setActive,
  drawPreview: drawPreview,
  makeBlob: makeBlob,
  bounds: bounds,
  buildGallery: buildGallery,
  removePhoto: removePhoto,
  onShare: onShare,
  exportDataURL: function(){
    const c = document.createElement('canvas');
    c.width = EXPORT_W; c.height = EXPORT_H;
    drawCard(c.getContext('2d'), EXPORT_W, EXPORT_H);
    return c.toDataURL('image/png');
  }
};
})();
